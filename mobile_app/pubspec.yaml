name: local_idea_capture
description: Android-first local AI voice idea and todo capture app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.3
  drift_flutter: ^0.2.1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.3
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  record: ^5.1.2
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
